<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquishEyeZ | On-Chain Utility Hub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    :root {
      --bg: #0a0a0f;
      --accent: #00ff9d;
      --text: #aaffcc;
      --muted: #55cc88;
      --dos-green: #00ff9d;
      --glow: 0 0 .6rem #00ff9d, 0 0 1.4rem rgba(0,255,157,.6);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; }
    .crt::before { content: ""; position: fixed; inset: 0; z-index: 9999; background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.18) 3px 4px); mix-blend-mode: multiply; opacity: .25; pointer-events: none; }
    .cabinet { max-width: 1100px; margin: 20px auto; padding: 0 12px; }
    .bezel { background: linear-gradient(145deg, #0a0a12, #020204); border: 3px solid #223322; border-radius: 12px; padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,.7); position: relative; overflow: hidden; }
    header { text-align: center; padding: 20px 0 10px; }
    h1 { font-family: 'Press Start 2P', monospace; color: #ff0037; text-shadow: var(--glow); font-size: clamp(28px, 4vw, 42px); letter-spacing: 2px; }
    .ribbon { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #111811; border: 2px solid #334433; padding: 10px; border-radius: 6px; }
    .wallet-btn { color: #001100; background: #00ff9d; border: 2px solid #00ff9d; padding: 12px 24px; font-family: 'Press Start 2P'; font-size: 13px; cursor: pointer; width: 100%; max-width: 320px; }
    section { background: #0f140f; border: 3px solid #334433; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .section-title { display: flex; align-items: center; gap: 8px; background: #112211; padding: 8px 12px; border-bottom: 2px solid #00ff9d; margin-bottom: 16px; }
    .led { width: 12px; height: 12px; background: #00ff9d; border-radius: 50%; box-shadow: 0 0 12px #00ff9d; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    .item { background: #111811; border: 2px solid #334433; padding: 16px; margin-bottom: 16px; border-radius: 6px; }
    select, input, button { font-family: 'Press Start 2P', monospace; padding: 12px; margin: 6px 0; background: #001100; color: #00ff9d; border: 2px solid #00ff9d; width: 100%; }
    button { cursor: pointer; }
    .status { background: #001100; padding: 14px; text-align: center; border: 2px solid #00ff9d; margin: 20px 0; font-family: 'Press Start 2P'; font-size: 13px; }
  </style>
</head>
<body class="crt">
  <div class="cabinet">
    <div class="bezel">
      <header>
        <h1>SQUISH EYEZ</h1>
        <p style="color:#55cc88; font-size:13px;">ON-CHAIN UTILITY HUB • Anchor + Mobile Ready</p>
        <nav class="ribbon">
          <button class="wallet-btn" id="connectWallet">CONNECT WALLET</button>
        </nav>
      </header>

      <div id="wallet-status" class="status">
        Wallet not connected
      </div>

      <!-- FARMS -->
      <section id="farms">
        <div class="section-title"><span class="led"></span><h2>$SQUISH FARMS — RECOVERY</h2></div>
        <div class="item">
          <label>Select Farm:</label><br>
          <select id="farmSelect">
            <option value="squish.bat">squish.bat — OG SquishEyez</option>
            <option value="squish2.exe">squish2.exe — Floppy assets</option>
          </select>
          <button onclick="claimRewards()" style="margin-top:12px;">CLAIM REWARDS</button>
        </div>
      </section>

      <!-- WRAP / UNWRAP -->
      <section id="wrapunwrap">
        <div class="section-title"><span class="led"></span><h2>$SQUISH WRAP / UNWRAP</h2></div>
        <div class="item">
          <button onclick="unwrapSQUISH()" style="background:#330000; border-color:#ff5555; margin-bottom:12px;">
            UNWRAP — Burn Wrapped NFT → Receive 69 $SQUISH
          </button>
          <button onclick="wrapSQUISH()">
            WRAP — 69 $SQUISH + Diskette → Wrapped NFT
          </button>
        </div>
      </section>

      <!-- PACK OPENING -->
      <section id="packs">
        <div class="section-title"><span class="led"></span><h2>OPEN NEFTYBLOCKS PACKS</h2></div>
        <div class="item">
          <label>Pack Asset ID:</label><br>
          <input type="text" id="packInput" placeholder="Enter Pack NFT ID">
          <button onclick="openPack()" style="margin-top:12px;">OPEN PACK</button>
        </div>
      </section>

      <footer style="text-align:center; padding:30px; color:#55cc88; font-size:11px;">
        &copy; 2025 Next Door Media (UK) • SquishEyeZ Permanent Hub
      </footer>
    </div>
  </div>

  <script type="module">
    import { Session } from 'https://esm.sh/@wharfkit/session@1.6.1'
    import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor@1.6.1'
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet@1.6.5'

    const WAX_CHAIN = {
      id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4',
      url: 'https://wax.greymass.com'
    }

    let session = null
    let userAccount = null

    const walletBtn = document.getElementById('connectWallet')
    const statusEl = document.getElementById('wallet-status')

    function showError(message) {
      console.error(message)
      statusEl.innerHTML = `❌ ERROR: ${message}<br><small>Check console for more details</small>`
      statusEl.style.color = '#ff5555'
      statusEl.style.borderColor = '#ff5555'
    }

    function updateStatus(html, color = '#00ff9d') {
      statusEl.innerHTML = html
      statusEl.style.color = color
      statusEl.style.borderColor = color
    }

    async function connectWallet() {
      updateStatus('Connecting... Please check your wallet app.', '#aaffcc')
      try {
        session = new Session({
          chain: WAX_CHAIN,
          walletPlugins: [new WalletPluginAnchor(), new WalletPluginCloudWallet()]
        })
        const result = await session.login()
        userAccount = result.account.toString()
        updateStatus(`✅ CONNECTED: <strong>${userAccount}</strong>`)
        walletBtn.textContent = `✅ ${userAccount} (click to disconnect)`
        walletBtn.onclick = disconnectWallet
      } catch (error) {
        showError(error.message || 'Unknown error during connection')
      }
    }

    async function disconnectWallet() {
      session = null
      userAccount = null
      updateStatus('Wallet not connected')
      walletBtn.textContent = 'CONNECT WALLET'
      walletBtn.onclick = connectWallet
    }

    walletBtn.addEventListener('click', connectWallet)

    async function signAndBroadcast(actions) {
      if (!session || !userAccount) {
        showError('Wallet not connected')
        return null
      }
      try {
        updateStatus('Signing transaction... Check your wallet.', '#aaffcc')
        const result = await session.transact({ actions })
        updateStatus(`✅ TX submitted: ${result.response?.transaction_id || 'success'}`)
        return result
      } catch (error) {
        showError(error.message || 'Transaction failed')
        return null
      }
    }

    window.claimRewards = async function() {
      const farmSelect = document.getElementById('farmSelect')
      const farmName = farmSelect ? farmSelect.value : 'squish.bat'
      const actions = [{
        account: 'farms.waxdao',
        name: 'claim',
        authorization: [{ actor: userAccount, permission: 'active' }],
        data: { user: userAccount, farmname: farmName }
      }]
      await signAndBroadcast(actions)
    }

    window.unwrapSQUISH = async function() {
      showError('Unwrap: Configure the correct WAXDAO blend action')
    }

    window.wrapSQUISH = async function() {
      showError('Wrap: Configure the correct blend/mint action')
    }

    window.openPack = async function() {
      const packIdInput = document.getElementById('packInput')
      const packId = packIdInput ? packIdInput.value.trim() : ''
      if (!packId || isNaN(packId)) {
        showError('Please enter a valid Pack NFT Asset ID')
        return
      }
      const actions = [{
        account: 'atomicassets',
        name: 'transfer',
        authorization: [{ actor: userAccount, permission: 'active' }],
        data: {
          from: userAccount,
          to: 'atomicpacksx',
          asset_ids: [packId],
          memo: 'unbox'
        }
      }]
      await signAndBroadcast(actions)
      updateStatus('Pack transfer submitted. After RNG resolves, call claimunboxed if needed.', '#aaffcc')
    }
  </script>
</body>
</html>
