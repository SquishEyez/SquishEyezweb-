<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SquishEyeZ | On-Chain Utility Hub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    :root{
      --bg:#0a0a0f;
      --accent-2:#00ff9d;
      --text:#aaffcc;
      --muted:#55cc88;
      --dos-green:#00ff9d;
      --glow:0 0 .6rem #00ff9d, 0 0 1.4rem rgba(0,255,157,.6);
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:'Courier New', monospace;}
    .crt:before{content:""; position:fixed; inset:0; z-index:9999; background:repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.18) 3px 4px); mix-blend-mode:multiply; opacity:.25; pointer-events:none;}
    .cabinet{max-width:1100px; margin:20px auto; padding:0 12px;}
    .bezel{background:linear-gradient(145deg, #0a0a12, #020204); border:3px solid #223322; border-radius:12px; padding:14px; box-shadow:0 10px 25px rgba(0,0,0,.7); position:relative; overflow:hidden;}
    .bezel > *{position:relative; z-index:2;}
    header{text-align:center; padding:20px 0 10px;}
    h1{font-family:'Press Start 2P', monospace; color:#ff0037; text-shadow:var(--glow); font-size:clamp(28px, 4vw, 42px); letter-spacing:2px;}
    .ribbon{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; background:#111811; border:2px solid #334433; padding:10px; border-radius:6px;}
    .wallet-btn{color:#001100; background:#00ff9d; border:2px solid #00ff9d; padding:12px 24px; font-family:'Press Start 2P'; font-size:13px; cursor:pointer; width:100%; max-width:320px;}
    section{background:#0f140f; border:3px solid #334433; border-radius:8px; padding:20px; margin:20px 0;}
    .section-title{display:flex; align-items:center; gap:8px; background:#112211; padding:8px 12px; border-bottom:2px solid #00ff9d; margin-bottom:16px;}
    .led{width:12px; height:12px; background:#00ff9d; border-radius:50%; box-shadow:0 0 12px #00ff9d; animation:blink 1.2s infinite;}
    @keyframes blink{50%{opacity:0.3}}
    .item{background:#111811; border:2px solid #334433; padding:16px; margin-bottom:16px; border-radius:6px;}
    select, input, button{font-family:'Press Start 2P', monospace; padding:12px; margin:6px 0; background:#001100; color:#00ff9d; border:2px solid #00ff9d; width:100%;}
    button{cursor:pointer;}
  </style>
</head>
<body class="crt">
  <div class="cabinet">
    <div class="bezel">

      <header>
        <h1>SQUISH EYEZ</h1>
        <p style="color:#55cc88; font-size:13px;">ON-CHAIN UTILITY HUB (WharfKit)</p>
        <nav class="ribbon">
          <button class="wallet-btn" id="connectWallet">CONNECT WALLET</button>
        </nav>
      </header>

      <div id="wallet-status" style="background:#001100; padding:14px; text-align:center; border:2px solid #00ff9d; margin:20px; font-family:'Press Start 2P';">
        Wallet not connected
      </div>

      <!-- Your sections (Farms, Wrap/Unwrap, Pack Opening) go here -->
      <!-- For now I'm leaving placeholders - we can fill them in once connection works -->

      <section style="text-align:center; padding:40px 20px;">
        <h3>Wallet Connection Status</h3>
        <p id="status-text">Click "CONNECT WALLET" above to begin</p>
      </section>

      <footer style="text-align:center; padding:30px; color:#55cc88; font-size:11px;">
        &copy; 2025 Next Door Media (UK) • SquishEyeZ Permanent Hub
      </footer>
    </div>
  </div>

  <!-- WharfKit Scripts -->
  <script type="module">
    import { Session } from 'https://cdn.jsdelivr.net/npm/@wharfkit/session@latest/+esm';
    import { WalletPluginAnchor } from 'https://cdn.jsdelivr.net/npm/@wharfkit/wallet-plugin-anchor@latest/+esm';
    import { WalletPluginCloudWallet } from 'https://cdn.jsdelivr.net/npm/@wharfkit/wallet-plugin-cloudwallet@latest/+esm';

    let session = null;
    let userAccount = null;

    const walletBtn = document.getElementById('connectWallet');
    const statusEl = document.getElementById('wallet-status');
    const statusText = document.getElementById('status-text');

    async function connectWallet() {
      try {
        const cloudWalletPlugin = new WalletPluginCloudWallet();
        const anchorPlugin = new WalletPluginAnchor();

        session = new Session({
          chain: {
            id: "1064487b3cd1a89790cf1a7c0c8d9e9f4d9f9f4d9f9f4d9f9f4d9f9f4d9f9f4d", // WAX mainnet
            url: "https://wax.greymass.com"
          },
          walletPlugin: [cloudWalletPlugin, anchorPlugin]
        });

        const result = await session.login();
        userAccount = result.account;

        statusEl.innerHTML = `✅ CONNECTED: <strong>${userAccount}</strong>`;
        statusEl.style.color = '#00ff9d';
        walletBtn.textContent = `✅ ${userAccount}`;

        statusText.textContent = `Connected as ${userAccount} — you can now use Farms, Wrap/Unwrap, and Pack Opening.`;
        console.log("Session created:", session);

      } catch (e) {
        console.error(e);
        statusText.textContent = "Connection failed or cancelled. Make sure Anchor Desktop is running or try My Cloud Wallet.";
      }
    }

    walletBtn.addEventListener('click', connectWallet);
  </script>
</body>
</html>
